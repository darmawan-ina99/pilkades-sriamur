<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Live — Pilkades</title>
  <link rel="stylesheet" href="src/styles/main.css?v=4">
  <style>
    .chart-bar { display:flex; align-items:flex-end; gap:16px; height:200px; padding:16px 0; border-bottom:2px solid var(--border); }
    .chart-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
    .chart-rect { width:100%; border-radius:8px 8px 0 0; transition:height .5s; min-height:4px; }
    .chart-label { font-size:12px; font-weight:700; text-align:center; }
    .chart-num { font-size:14px; font-weight:800; }
    .candidate-foto { width:48px; height:48px; border-radius:50%; object-fit:cover; flex-shrink:0; }
    .candidate-foto-placeholder { width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:20px; flex-shrink:0; }
    .winner-foto { width:80px; height:80px; border-radius:50%; object-fit:cover; border:3px solid var(--gold); }
    .winner-foto-placeholder { width:80px; height:80px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:32px; border:3px solid var(--gold); }
  </style>
</head>
<body>
<nav class="navbar">
  <a class="navbar-brand" href="index.html">🗳️ Tabulasi Pilkades</a>
  <div class="nav-links">
    <a href="index.html">Beranda</a>
    <a href="hasil.html" class="active">Hasil Live</a>
    <a href="input.html">Input Data</a>
    <a href="rekap.html">Rekap</a>
    <a href="admin.html">Admin</a>
  </div>
</nav>

<div class="section">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <div class="section-title" style="margin-bottom:0;">📊 Hasil Live</div>
    <div style="display:inline-flex;align-items:center;gap:6px;background:#fef2f2;padding:6px 12px;border-radius:999px;">
      <span class="live-dot"></span><span style="font-size:12px;font-weight:700;color:var(--accent);">LIVE</span>
    </div>
  </div>

  <div class="card" style="text-align:center;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;margin-bottom:16px;">
    <div id="hero-judul" style="font-size:18px;font-weight:800;margin-bottom:8px;">Pemilihan Kepala Desa</div>
    <div style="font-size:13px;opacity:.8;">Total DPT</div>
    <div style="font-size:32px;font-weight:800;margin:4px 0;" id="dpt-total">0</div>
    <div style="font-size:12px;opacity:.7;">Jiwa</div>
  </div>

  <div class="card" style="text-align:center;margin-bottom:16px;">
    <div class="progress-ring" style="width:100px;height:100px;">
      <svg width="100" height="100"><circle class="bg" cx="50" cy="50" r="42" stroke-width="8" /><circle class="fg" cx="50" cy="50" r="42" stroke-width="8" id="ring" stroke-dasharray="264" stroke-dashoffset="264" /></svg>
      <div class="progress-ring-text" style="font-size:20px;" id="ring-text">0%</div>
    </div>
    <div style="font-size:13px;color:var(--muted);"><span id="ring-sub">0 dari 40 TPS</span> sudah diinput</div>
  </div>

  <div class="card"><div style="font-weight:800;margin-bottom:8px;">Grafik Perolehan Suara</div><div class="chart-bar" id="chart-bar"></div></div>
  <div id="calon-list"><div class="spinner"></div></div>

  <div class="stat-grid">
    <div class="stat-item"><div class="stat-num" style="color:var(--green);" id="s-sah">0</div><div class="stat-label">Suara Sah</div></div>
    <div class="stat-item"><div class="stat-num" style="color:var(--accent);" id="s-tidak">0</div><div class="stat-label">Tidak Sah</div></div>
    <div class="stat-item"><div class="stat-num" style="color:var(--gold);" id="s-abstain">0</div><div class="stat-label">Abstain</div></div>
    <div class="stat-item"><div class="stat-num" style="color:var(--primary);" id="s-partisipasi">0%</div><div class="stat-label">Partisipasi</div></div>
  </div>

  <div class="card" id="tps-belum-card" style="display:none;">
    <div style="font-weight:800;color:var(--gold);margin-bottom:8px;">⏳ TPS Belum Diinput</div>
    <div id="tps-belum-list" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
  </div>

  <div id="winner-box" style="display:none;">
    <div class="card" style="text-align:center;background:linear-gradient(135deg,#fef3c7,#fde68a);border:2px solid var(--gold);">
      <div style="font-size:48px;">👑</div>
      <div id="winner-foto-container" style="margin:8px auto;width:80px;height:80px;"></div>
      <div style="font-size:14px;font-weight:700;color:#92400e;">Calon Terdepan Sementara</div>
      <div style="font-size:24px;font-weight:800;margin:8px 0;" id="winner-name"></div>
      <div style="font-size:32px;font-weight:800;color:var(--primary);" id="winner-votes"></div>
      <div style="font-size:13px;color:var(--muted);" id="winner-pct"></div>
    </div>
  </div>
</div>

<script src="src/scripts/config.js?v=4"></script>
<script src="src/scripts/utils.js?v=4"></script>
<script>
  const COLORS = ['#1e40af', '#dc2626', '#16a34a', '#f59e0b'];

  async function loadConfig() {
    const res = await Utils.api("get_config", {});
    if (res.ok && res.config) {
      document.getElementById("hero-judul").textContent = res.config.judul;
      document.title = "Hasil Live — " + res.config.judul;
    }
  }

  async function loadHasil() {
    const res = await Utils.api("rekap", {});
    if (!res.ok) return;
    const r = res.rekap;
    document.getElementById("dpt-total").textContent = Utils.formatAngka(r.total_pemilih);
    const pct = r.tps_total > 0 ? Math.round((r.tps_sudah / r.tps_total) * 100) : 0;
    document.getElementById("ring").style.strokeDashoffset = 264 - (264 * pct / 100);
    document.getElementById("ring-text").textContent = pct + "%";
    document.getElementById("ring-sub").textContent = `${r.tps_sudah} dari ${r.tps_total} TPS`;
    document.getElementById("s-sah").textContent = Utils.formatAngka(r.total_suara_sah);
    document.getElementById("s-tidak").textContent = Utils.formatAngka(r.total_suara_tidak_sah);
    document.getElementById("s-abstain").textContent = Utils.formatAngka(r.total_abstain);
    document.getElementById("s-partisipasi").textContent = r.persentase_partisipasi + "%";
    const maxSuara = Math.max(...r.calon.map(c => c.suara), 1);
    document.getElementById("chart-bar").innerHTML = r.calon.map(c => {
      const h = (c.suara / maxSuara) * 180;
      const pctSuara = r.total_suara_sah > 0 ? Math.round((c.suara / r.total_suara_sah) * 100) : 0;
      return `<div class="chart-col"><div class="chart-num">${Utils.formatAngka(c.suara)}</div><div class="chart-rect" style="height:${h}px;background:${COLORS[c.nomor_urut-1]||'#888'};"></div><div class="chart-label">No. ${c.nomor_urut}<br>${pctSuara}%</div></div>`;
    }).join("");
    document.getElementById("calon-list").innerHTML = r.calon.map((c, i) => {
      const pctSuara = r.total_suara_sah > 0 ? Math.round((c.suara / r.total_suara_sah) * 100) : 0;
      const isWinner = i === 0 && c.suara > 0;
      const color = COLORS[c.nomor_urut-1]||'#888';
      const fotoHTML = c.foto ? `<img src="${c.foto}" class="candidate-foto" alt="${c.nama||'Calon '+c.nomor_urut}">` : `<div class="candidate-foto-placeholder" style="background:${color};">${c.nomor_urut}</div>`;
      return `<div class="candidate-card ${isWinner?'winner':''}"><div class="candidate-header">${fotoHTML}<div style="flex:1;margin-left:12px;"><div class="candidate-name">${c.nama||'Calon '+c.nomor_urut}</div>${isWinner?'<span style="color:#f59e0b;font-size:12px;font-weight:700;">👑 Terdepan</span>':''}</div><div style="text-align:right;"><div class="candidate-votes">${Utils.formatAngka(c.suara)}</div><div class="candidate-pct">${pctSuara}%</div></div></div><div class="bar-container"><div class="bar-fill" style="width:${(c.suara/maxSuara)*100}%;background:${color};">${pctSuara}%</div></div></div>`;
    }).join("");
    if (r.calon[0] && r.calon[0].suara > 0) {
      const w = r.calon[0];
      const wColor = COLORS[w.nomor_urut-1]||'#888';
      document.getElementById("winner-box").style.display = "block";
      document.getElementById("winner-name").textContent = w.nama || "Calon No. " + w.nomor_urut;
      document.getElementById("winner-votes").textContent = Utils.formatAngka(w.suara) + " suara";
      const pctSuara = r.total_suara_sah > 0 ? Math.round((w.suara / r.total_suara_sah) * 100) : 0;
      document.getElementById("winner-pct").textContent = `${pctSuara}% dari suara sah · ${r.tps_sudah}/${r.tps_total} TPS`;
      document.getElementById("winner-foto-container").innerHTML = w.foto ? `<img src="${w.foto}" class="winner-foto" alt="${w.nama}">` : `<div class="winner-foto-placeholder" style="background:${wColor};">${w.nomor_urut}</div>`;
    }
    if (r.tps_belum_list && r.tps_belum_list.length > 0) {
      document.getElementById("tps-belum-card").style.display = "block";
      document.getElementById("tps-belum-list").innerHTML = r.tps_belum_list.map(n => `<span class="badge badge-belum">TPS ${n}</span>`).join("");
    } else { document.getElementById("tps-belum-card").style.display = "none"; }
  }

  loadConfig().then(() => loadHasil());
  setInterval(loadHasil, 10000);
</script>
</body>
</html>
