<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Data — Realcount Pilkades</title>
  <link rel="stylesheet" href="src/styles/main.css?v=15">
</head>
<body>
<nav class="navbar">
  <a class="navbar-brand" href="index.html">🗳️ Realcount Pilkades</a>
  <div class="nav-links">
    <a href="index.html">Beranda</a>
    <a href="hasil.html">Hasil Live</a>
    <a href="input.html" class="active">Input Data</a>
    <a href="rekap.html">Rekap</a>
    <a href="admin.html">Admin</a>
  </div>
</nav>

<div class="section">
  <div class="section-title">📝 Input Suara TPS</div>

  <div class="card">
    <div class="form-group">
      <label class="form-label">Pilih TPS</label>
      <select id="select-tps" class="form-control" onchange="loadTPS()">
        <option value="">-- Pilih TPS --</option>
      </select>
    </div>
    <div id="loading-msg" style="text-align:center;padding:16px;color:#666;font-size:14px;">⏳ Memuat daftar TPS...</div>
    <div id="error-msg" style="display:none;text-align:center;padding:16px;color:#ef4444;font-size:14px;font-weight:600;"></div>
  </div>

  <div id="form-input" style="display:none;">
    <div class="card">
      <div style="font-weight:800;margin-bottom:12px;color:var(--primary);">📊 Data Suara TPS <span id="tps-num-label"></span></div>
      <div class="form-group">
        <label class="form-label">👤 Nama Saksi TPS <span style="color:#ef4444;">*</span></label>
        <input type="text" id="inp-saksi" class="form-control" placeholder="Nama lengkap saksi TPS ini" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">Jumlah Pemilih (DPT)</label>
        <input type="number" id="inp-pemilih" class="form-control" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">Suara Sah</label>
        <input type="number" id="inp-sah" class="form-control" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">Suara Tidak Sah</label>
        <input type="number" id="inp-tidak" class="form-control" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">Abstain</label>
        <input type="number" id="inp-abstain" class="form-control" placeholder="0">
      </div>
    </div>

    <div class="card">
      <div style="font-weight:800;margin-bottom:12px;color:var(--primary);">🗳️ Suara per Calon</div>
      <div id="calon-input-list"></div>
    </div>

    <div class="card">
      <div class="form-group">
        <label class="form-label">Catatan (opsional)</label>
        <textarea id="inp-catatan" class="form-control" rows="3" placeholder="Catatan untuk TPS ini..."></textarea>
      </div>
    </div>

    <div class="card">
      <div class="form-group">
        <label class="form-label">🔐 PIN TPS <span style="font-weight:400;color:var(--muted);">(khusus saksi TPS ini)</span></label>
        <input type="password" id="inp-pin" class="form-control" placeholder="PIN 2 digit sesuai nomor TPS" maxlength="2" inputmode="numeric" autocomplete="off">
        <div style="font-size:11px;color:var(--muted);margin-top:4px;">Contoh: TPS 1 = PIN 01, TPS 25 = PIN 25</div>
      </div>
    </div>

    <button class="btn btn-success btn-block" onclick="simpanSuara()">💾 Simpan Input TPS</button>
    <button class="btn btn-block" style="background:#ef4444;color:#fff;margin-top:8px;" onclick="resetTPS()">🔄 Reset Input TPS Ini</button>
  </div>
</div>

<script src="src/scripts/config.js?v=15"></script>
<script src="src/scripts/utils.js?v=15"></script>
<script>
  const COLORS = ['#1e40af', '#dc2626', '#16a34a', '#f59e0b'];
  let calonList = [];
  let tpsList = [];

  async function init() {
    const sel = document.getElementById("select-tps");
    const loadingMsg = document.getElementById("loading-msg");
    const errorMsg = document.getElementById("error-msg");

    try {
      // Load TPS first (don't wait for calon)
      const resTps = await Utils.api("get_tps", {});
      if (resTps.ok && resTps.tps) {
        tpsList = resTps.tps;
        tpsList.forEach(t => {
          const status = t.status_input === "sudah" ? " ✅" : "";
          sel.innerHTML += '<option value="' + t.nomor_tps + '">TPS ' + t.nomor_tps + status + '</option>';
        });
        loadingMsg.style.display = "none";
      } else {
        loadingMsg.style.display = "none";
        errorMsg.style.display = "block";
        errorMsg.textContent = "Gagal memuat TPS: " + (resTps.error || "unknown error");
      }

      // Load calon in background
      const resCalon = await Utils.api("get_calon", {});
      if (resCalon.ok && resCalon.calon) {
        calonList = resCalon.calon;
      }

      // Auto-select TPS if query param exists
      const params = new URLSearchParams(location.search);
      if (params.get("tps")) {
        sel.value = params.get("tps");
        loadTPS();
      }
    } catch (err) {
      loadingMsg.style.display = "none";
      errorMsg.style.display = "block";
      errorMsg.textContent = "Error: " + err.message;
    }
  }

  async function loadTPS() {
    const nomor = parseInt(document.getElementById("select-tps").value);
    if (!nomor) { document.getElementById("form-input").style.display = "none"; return; }
    document.getElementById("form-input").style.display = "block";
    document.getElementById("tps-num-label").textContent = nomor;
    const tps = tpsList.find(t => t.nomor_tps === nomor);
    document.getElementById("inp-saksi").value = tps?.nama_saksi || "";
    document.getElementById("inp-pemilih").value = tps?.jumlah_pemilih || 0;
    document.getElementById("inp-sah").value = tps?.suara_sah || 0;
    document.getElementById("inp-tidak").value = tps?.suara_tidak_sah || 0;
    document.getElementById("inp-abstain").value = tps?.suara_abstain || 0;
    document.getElementById("inp-catatan").value = tps?.catatan || "";
    const suaraRes = await Utils.api("get_suara_tps", { nomor_tps: nomor });
    const suaraMap = {};
    if (suaraRes.ok) suaraRes.suara.forEach(s => { suaraMap[s.calon_id] = s.jumlah_suara; });
    const el = document.getElementById("calon-input-list");
    el.innerHTML = calonList.map(c => {
      const color = COLORS[c.nomor_urut - 1] || '#888';
      const val = suaraMap[c.id] || 0;
      return '<div class="form-group"><label class="form-label"><span style="display:inline-flex;align-items:center;gap:8px;"><span style="display:inline-flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;background:' + color + ';color:#fff;font-weight:800;font-size:13px;">' + c.nomor_urut + '</span>' + (c.nama || 'Calon ' + c.nomor_urut) + '</span></label><input type="number" id="calon-' + c.id + '" class="form-control" placeholder="0" value="' + val + '"></div>';
    }).join("");
  }

  async function resetTPS() {
    const nomor_tps = parseInt(document.getElementById("select-tps").value);
    if (!nomor_tps) { Utils.toast("Pilih TPS dulu!", "warn"); return; }
    if (!confirm("Reset input TPS " + nomor_tps + "?\nSemua data suara TPS ini akan dihapus dari rekap.")) return;
    if (!cekPinTPS(nomor_tps)) return;
    const res = await Utils.api("reset_tps", { nomor_tps });
    if (res.ok) {
      Utils.toast(res.pesan || "TPS direset", "success");
      const tps = tpsList.find(t => t.nomor_tps === nomor_tps);
      if (tps) { tps.status_input = "belum"; tps.suara_sah = 0; tps.suara_tidak_sah = 0; tps.suara_abstain = 0; tps.total_suara_masuk = 0; tps.catatan = ""; }
      document.getElementById("inp-pin").value = "";
      loadTPS();
    } else { Utils.toast("Gagal: " + (res.error || res.pesan || ""), "error"); }
  }

  function cekPinTPS(nomor_tps) {
    const pin = (document.getElementById("inp-pin").value || "").trim();
    const pinHarus = String(nomor_tps).padStart(2, "0");
    if (pin !== pinHarus) { Utils.toast("PIN salah! Gunakan PIN sesuai nomor TPS (contoh TPS 1 = 01)", "error"); return false; }
    return true;
  }

  async function simpanSuara() {
    const nomor_tps = parseInt(document.getElementById("select-tps").value);
    if (!nomor_tps) { Utils.toast("Pilih TPS dulu!", "warn"); return; }
    if (!cekPinTPS(nomor_tps)) return;
    const nama_saksi = (document.getElementById("inp-saksi").value || "").trim();
    if (!nama_saksi) { Utils.toast("Nama saksi wajib diisi!", "warn"); return; }
    const jumlah_pemilih = parseInt(document.getElementById("inp-pemilih").value) || 0;
    const suara_sah = parseInt(document.getElementById("inp-sah").value) || 0;
    const suara_tidak_sah = parseInt(document.getElementById("inp-tidak").value) || 0;
    const suara_abstain = parseInt(document.getElementById("inp-abstain").value) || 0;
    const catatan = document.getElementById("inp-catatan").value;
    const suara_calon = calonList.map(c => ({ calon_id: c.id, nomor_urut: c.nomor_urut, jumlah_suara: parseInt(document.getElementById("calon-"+c.id).value) || 0 }));
    Utils.toast("Menyimpan...", "info");
    const payload = { nomor_tps, nama_saksi, jumlah_pemilih, suara_sah, suara_tidak_sah, suara_abstain, suara_calon, catatan };
    let res = null;
    for (let i = 1; i <= 4; i++) {
      res = await Utils.api("input_suara", payload);
      if (res.ok) break;
      const limit = String(res.error || "").toLowerCase().includes("rate limit");
      if (!limit || i === 4) break;
      Utils.toast("Server sibuk, ulangi otomatis (" + i + "/3). JANGAN tutup halaman ini.", "warn");
      await new Promise(r => setTimeout(r, 10000 * i));
    }
    if (res && res.ok) { Utils.toast(res.pesan, "success"); setTimeout(() => location.href = "hasil.html", 1500); }
    else { Utils.toast("GAGAL: " + (res && res.error) + ". Data masih ada di form - tekan SIMPAN lagi.", "error"); }
  }
  init();
</script>
</body>
</html>
