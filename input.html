<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Data — Realcount Pilkades</title>
  <link rel="stylesheet" href="src/styles/main.css?v=8">
</head>
<body>
<nav class="navbar">
  <a class="navbar-brand" href="index.html">🗳️ Realcount Pilkades</a>
  <div class="nav-links">
    <a href="index.html">Beranda</a>
    <a href="hasil.html">Hasil Live</a>
    <a href="input.html" class="active">Input Data</a>
    <a href="rekap.html">Rekap</a>
    <a href="admin.html">Admin</a>
  </div>
</nav>

<div class="section">
  <div class="section-title">📝 Input Suara TPS</div>

  <div class="card">
    <div class="form-group">
      <label class="form-label">Pilih TPS</label>
      <select id="select-tps" class="form-control" onchange="loadTPS()">
        <option value="">-- Pilih TPS --</option>
      </select>
    </div>
  </div>

  <div id="form-input" style="display:none;">
    <div class="card">
      <div style="font-weight:800;margin-bottom:12px;color:var(--primary);">📊 Data Suara TPS <span id="tps-num-label"></span></div>
      <div class="form-group">
        <label class="form-label">Jumlah Pemilih (DPT)</label>
        <input type="number" id="inp-pemilih" class="form-control" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">Suara Sah</label>
        <input type="number" id="inp-sah" class="form-control" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">Suara Tidak Sah</label>
        <input type="number" id="inp-tidak" class="form-control" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">Abstain</label>
        <input type="number" id="inp-abstain" class="form-control" placeholder="0">
      </div>
    </div>

    <div class="card">
      <div style="font-weight:800;margin-bottom:12px;color:var(--primary);">🗳️ Suara per Calon</div>
      <div id="calon-input-list"></div>
    </div>

    <div class="card">
      <div class="form-group">
        <label class="form-label">Catatan (opsional)</label>
        <textarea id="inp-catatan" class="form-control" rows="3" placeholder="Catatan untuk TPS ini..."></textarea>
      </div>
    </div>

    <button class="btn btn-success btn-block" onclick="simpanSuara()">💾 Simpan Input TPS</button>
  </div>
</div>

<script src="src/scripts/config.js?v=8"></script>
<script src="src/scripts/utils.js?v=8"></script>
<script>
  const COLORS = ['#1e40af', '#dc2626', '#16a34a', '#f59e0b'];
  let calonList = [];
  let tpsList = [];

  async function init() {
    const [resTps, resCalon] = await Promise.all([Utils.api("get_tps", {}), Utils.api("get_calon", {})]);
    if (resTps.ok) {
      tpsList = resTps.tps;
      const sel = document.getElementById("select-tps");
      tpsList.forEach(t => {
        const status = t.status_input === "sudah" ? " ✅" : "";
        sel.innerHTML += `<option value="${t.nomor_tps}">TPS ${t.nomor_tps}${status}</option>`;
      });
    }
    if (resCalon.ok) calonList = resCalon.calon;
    const params = new URLSearchParams(location.search);
    if (params.get("tps")) { sel.value = params.get("tps"); loadTPS(); }
  }

  async function loadTPS() {
    const nomor = parseInt(document.getElementById("select-tps").value);
    if (!nomor) { document.getElementById("form-input").style.display = "none"; return; }
    document.getElementById("form-input").style.display = "block";
    document.getElementById("tps-num-label").textContent = nomor;
    const tps = tpsList.find(t => t.nomor_tps === nomor);
    document.getElementById("inp-pemilih").value = tps?.jumlah_pemilih || 0;
    document.getElementById("inp-sah").value = tps?.suara_sah || 0;
    document.getElementById("inp-tidak").value = tps?.suara_tidak_sah || 0;
    document.getElementById("inp-abstain").value = tps?.suara_abstain || 0;
    document.getElementById("inp-catatan").value = tps?.catatan || "";
    const suaraRes = await Utils.api("get_suara_tps", { nomor_tps: nomor });
    const suaraMap = {};
    if (suaraRes.ok) suaraRes.suara.forEach(s => { suaraMap[s.calon_id] = s.jumlah_suara; });
    const el = document.getElementById("calon-input-list");
    el.innerHTML = calonList.map(c => {
      const color = COLORS[c.nomor_urut - 1] || '#888';
      const val = suaraMap[c.id] || 0;
      return `<div class="form-group"><label class="form-label"><span style="display:inline-flex;align-items:center;gap:8px;"><span style="display:inline-flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;background:${color};color:#fff;font-weight:800;font-size:13px;">${c.nomor_urut}</span>${c.nama || 'Calon '+c.nomor_urut}</span></label><input type="number" id="calon-${c.id}" class="form-control" placeholder="0" value="${val}"></div>`;
    }).join("");
  }

  async function simpanSuara() {
    const nomor_tps = parseInt(document.getElementById("select-tps").value);
    if (!nomor_tps) { Utils.toast("Pilih TPS dulu!", "warn"); return; }
    const jumlah_pemilih = parseInt(document.getElementById("inp-pemilih").value) || 0;
    const suara_sah = parseInt(document.getElementById("inp-sah").value) || 0;
    const suara_tidak_sah = parseInt(document.getElementById("inp-tidak").value) || 0;
    const suara_abstain = parseInt(document.getElementById("inp-abstain").value) || 0;
    const catatan = document.getElementById("inp-catatan").value;
    const suara_calon = calonList.map(c => ({ calon_id: c.id, nomor_urut: c.nomor_urut, jumlah_suara: parseInt(document.getElementById("calon-"+c.id).value) || 0) }));
    Utils.toast("Menyimpan...", "info");
    const res = await Utils.api("input_suara", { nomor_tps, jumlah_pemilih, suara_sah, suara_tidak_sah, suara_abstain, suara_calon, catatan });
    if (res.ok) { Utils.toast(res.pesan, "success"); setTimeout(() => location.href = "hasil.html", 1500); }
    else Utils.toast("Gagal: " + res.error, "error");
  }
  init();
</script>
</body>
</html>
